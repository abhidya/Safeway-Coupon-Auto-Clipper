<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safeway Coupon Auto-clicker Offline Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.4; }
    button { margin: .5rem .5rem .5rem 0; padding: .6rem .9rem; }
    [data-safeway-auto-clipper-seen="true"] { outline: 3px solid #2f855a; }
    #events { background: #f6f8fa; padding: 1rem; min-height: 4rem; }
  </style>
</head>
<body>
  <h1>Offline Coupon Fixture</h1>
  <p>This local page mimics the button classes used by the userscript. With dry-run enabled, buttons are marked and logged but not clicked.</p>
  <section id="coupons">
    <button class="btn grid-coupon-btn btn-default">Clip Coupon A</button>
    <button class="btn grid-coupon-btn btn-default">Clip Coupon B</button>
  </section>
  <button class="btn load-more" type="button">Load more</button>
  <pre id="events"></pre>
  <script>
    const events = document.querySelector('#events');
    document.addEventListener('click', (event) => {
      if (event.target.matches('button')) {
        events.textContent += `clicked: ${event.target.textContent}\n`;
      }
    });
  </script>
  <script src="./couponclipper.user.js"></script>
</body>
</html>
